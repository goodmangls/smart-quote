name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Coverage must run here, not plain `vitest run`. The thresholds in
      # vitest.config.ts only apply when coverage is collected, so without this
      # flag the regression floor would silently never be enforced.
      - run: npm run test:coverage

  backend-rubocop:
    # Ruby patch version과 별개로 runner 변경을 피하려고 Ubuntu 24.04 고정을 유지한다.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: smart-quote-api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.13'
          bundler-cache: true
          working-directory: smart-quote-api
      # Fail on any offense (Convention+) so style debt cannot re-accumulate.
      - run: bundle exec rubocop --format github

  backend-rspec:
    # Ruby patch version과 별개로 runner 변경을 피하려고 Ubuntu 24.04 고정을 유지한다.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_quote_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: smart-quote-api
    env:
      RAILS_ENV: test
      PGPASSWORD: postgres
      DATABASE_URL: postgresql:///smart_quote_api_test?host=localhost&user=postgres
      FRONTEND_URL: http://localhost:5173
      AUTH_ORIGIN_CHECK: 'true'
      CORS_ORIGINS: http://localhost:5173,https://bridgelogis.com
      REFRESH_COOKIE_SECURE: 'false'
      REFRESH_COOKIE_SAME_SITE: Lax
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.13'
          bundler-cache: true
          working-directory: smart-quote-api
      # db:test:prepare loads schema WITHOUT seeds. db:prepare seeds margin_rules
      # (db/seeds/margin_rules.rb) which, committed outside transactional fixtures,
      # pollutes margin/resolver specs (rules.length, matched rule names).
      - run: bundle exec rails db:test:prepare
      - run: bundle exec rspec

  e2e:
    # Playwright 1.58.2 does not support Chromium on the Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    needs: [check, backend-rspec, backend-rubocop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: ./lighthouserc.json
